name: Bug report
description: Something in gravity-hud rendered wrong, crashed, or edited settings badly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste your account email, API keys, credentials, or raw transcript contents. A redacted fixture is enough.
  - type: input
    id: version
    attributes:
      label: gravity-hud version
      description: Output of `gravity-hud --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js and OS
      placeholder: Node 22, macOS 15
    validations:
      required: true
  - type: input
    id: agy
    attributes:
      label: Antigravity CLI version
      description: `agy --version`, if you have it.
      placeholder: 1.4.5
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what the status line showed instead.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Redacted session JSON
      description: Delete the email field and any private paths before pasting.
      render: json
