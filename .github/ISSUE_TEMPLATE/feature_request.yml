name: Feature request
description: A segment, theme, or install behavior that would make the HUD more useful.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot see, or what is awkward, in the status line today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would solve it. Mention if it needs network access or a new transcript field.
    validations:
      required: true
  - type: dropdown
    id: preset
    attributes:
      label: Which preset should include it?
      options:
        - compact (default)
        - full
        - optional, off by default
        - not sure
    validations:
      required: true
